buildscript {
    ext.kotlin_version = '2.1.0'
//    ext.kotlin_version = '1.8.22'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
//        classpath 'com.android.tools.build:gradle:8.1.0'
//        Changed to this
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter() is deprecated; keep only if older libraries strictly require it
        jcenter()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    // 1. Set the build directory
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // 2. The Global Namespace Fix
    // We use afterEvaluate with a try-catch style or direct check
    // to ensure we catch plugins like :auto_orientation
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

// 3. Separate the app dependency to avoid circular evaluation loops
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}