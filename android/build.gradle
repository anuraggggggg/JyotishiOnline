buildscript {
    ext.kotlin_version = '1.9.21'

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://storage.googleapis.com/r8-releases/raw")
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'  // Updated to newer stable AGP version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.android.tools:r8:8.2.47"           // Updated R8 version
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()  // Deprecated but might still be needed for some libs
        maven { url 'https://jitpack.io' }
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xlint:-options'
    }

    configurations.all {
        exclude group: "io.agora.rtc", module: "full-screen-sharing"
        exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = '17' // Match your app-level Java compatibility
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
